[package]
name = "paradl-net"
description = "HTTP client, probe, RFC 6266 filenames, ETag, DNS/DoH, routing, and site resolvers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
repository = "https://github.com/tawsifx/parallel-dl"
homepage = "https://github.com/tawsifx/parallel-dl#readme"
documentation = "https://docs.rs/paradl-net"
keywords = ["paradl", "download", "http", "dns", "routing"]
categories = ["network-programming"]

[features]
default = []
# Optional DNS-over-HTTPS via the hickory-dns project's `hickory-resolver`
# client library. No feature is exposed for HTTP/3 (unimplemented, log-dropped).
doh = ["dep:hickory-resolver"]

[dependencies]
paradl-core = { path = "../paradl-core" }
tokio = { workspace = true }
# `blocking` is used only by the synchronous ISP detector (`detect_isp`).
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
# Used by the PyPI site resolver to read `Requires-Dist` from wheel METADATA.
zip = { workspace = true }
hickory-resolver = { version = "0.25", optional = true, default-features = false, features = [
    "tokio",
    "system-config",
    "https-ring",
    "webpki-roots",
] }
