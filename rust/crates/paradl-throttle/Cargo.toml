[package]
name = "paradl-throttle"
description = "Traffic classifier, parsers, budget, probes, targets, VPS server, and reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
repository = "https://github.com/tawsifx/parallel-dl"
homepage = "https://github.com/tawsifx/parallel-dl#readme"
documentation = "https://docs.rs/paradl-throttle"
keywords = ["paradl", "throttle", "classifier", "diagnostics", "vps"]
categories = ["network-programming"]

[features]
default = []
server = ["dep:tokio"]

[dependencies]
paradl-core = { path = "../paradl-core" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, optional = true }
