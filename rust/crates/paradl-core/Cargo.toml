[package]
name = "paradl-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Tawsif Rahman"]
description = "Shared models, byte-exact helpers, configuration, paths, clock, and the single Error->ExitCode model for the paraDL framework."
readme = "README.md"
repository = "https://github.com/tawsifx/parallel-dl"
keywords = ["paradl", "download", "core", "models"]
categories = ["data-structures"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
