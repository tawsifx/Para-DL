# Workspace for the in-process Rust download engine that replaces the aria2 JSON-RPC
# control plane in paradl. The engine core is a trimmed, GPL-3.0-or-later port of
# Mister Download Manager's `crates/engine` (https://github.com/anefzaoui/misterdownloadmanager).
[workspace]
members = ["mdm-engine", "paradl-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
# Original engine copyright retained; local adaptation credited separately in file headers.
authors = ["Ahmed Nefzaoui (original MDM engine)", "Tawsif Rahman (paradl adaptation)"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
base64 = "0.22"
hex = "0.4"
httpdate = "1"
url = { version = "2", features = ["serde"] }
bytes = "1"
futures = "0.3"
thiserror = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
