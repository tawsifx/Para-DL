# paraDL is now a native Rust application. The `paradl` and `parallel-dl`
# commands are owned by the Rust binary built from `rust/` (see README.md).
#
# This root pyproject.toml is retained ONLY as a minimal legacy/tooling stub.
# It no longer builds or ships the Python application: `src/paradl/`, `tests/`
# and `parallel-dl.py` were removed in the Wave 5-1 cutover. The sole remaining
# Python surface is the OPTIONAL media worker in `media/` (see
# `media/pyproject.toml`), installed into a separate venv and discovered through
# `PARADL_MEDIA_PY`. Non-media paths require no Python at all.

[project]
name = "parallel-dl"
version = "1.0.0"
description = "Legacy tooling stub; paraDL is now the native Rust binary in rust/"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tawsif Rahman" }
]
requires-python = ">=3.11"
# No runtime dependencies and NO [project.scripts]: the native binary owns both
# entry points. Media dependencies live in media/pyproject.toml.
dependencies = []

[project.urls]
Homepage = "https://github.com/tawsifx/Para-DL"
Documentation = "https://github.com/tawsifx/Para-DL#readme"
Repository = "https://github.com/tawsifx/Para-DL.git"
Issues = "https://github.com/tawsifx/Para-DL/issues"

# Legacy development tooling only. Not used to install or run paraDL.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort imports
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "PERF",   # pylint performance
    "RET",    # flake8-return
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
]
lint.ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default args (intentional in some places)
    "UP007",  # union type annotations (we use X | Y)
]
format.quote-style = "double"
format.docstring-code-format = true
