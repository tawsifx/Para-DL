[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-dl"
version = "1.0.0"
description = "High-Performance Multi-Channel Download Accelerator with Anti-Throttle Watchdog"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tawsif Rahman" }
]
keywords = [
    "download-accelerator",
    "aria2",
    "anti-throttle",
    "multichannel",
    "windows",
    "windows-10",
    "windows-11",
    "macos",
    "apple-silicon",
    "homebrew",
    "pypi",
    "media-downloader"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.28.0",
    "mutagen>=1.47.0",
    "packaging>=23.0",
    "yt-dlp[default]>=2026.6.9",
]

[project.urls]
Homepage = "https://github.com/tawsifx/Para-DL"
Documentation = "https://github.com/tawsifx/Para-DL#readme"
Repository = "https://github.com/tawsifx/Para-DL.git"
Issues = "https://github.com/tawsifx/Para-DL/issues"

[project.scripts]
paradl = "pdl.cli:main"
parallel-dl = "pdl.cli:main"
pdl = "pdl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "httpx[http2]>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdl"]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
lint.select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort imports
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "PERF",   # pylint performance
    "RET",    # flake8-return
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
]
lint.ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default args (intentional in some places)
    "UP007",  # union type annotations (we use X | Y)
]
format.quote-style = "double"
format.docstring-code-format = true
isort.known-first-party = ["pdl"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
