[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-dl"
version = "1.0.0"
description = "High-Performance Multi-Channel Download Accelerator with Anti-Throttle Watchdog"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tawsif Rahman" }
]
keywords = [
    "download-accelerator",
    "aria2",
    "anti-throttle",
    "multichannel",
    "homebrew",
    "pypi",
    "media-downloader",
    "macos",
    "apple-silicon"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.28.0",
    "mutagen>=1.47.0",
    "yt-dlp[default]>=2026.6.9",
]

[project.urls]
Homepage = "https://github.com/tawsifx/pdl"
Documentation = "https://github.com/tawsifx/pdl#readme"
Repository = "https://github.com/tawsifx/pdl.git"
Issues = "https://github.com/tawsifx/pdl/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
paradl = "pdl.cli:main"
parallel-dl = "pdl.cli:main"
pdl = "pdl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl"]
dev-mode-dirs = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pdl"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
